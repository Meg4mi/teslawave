name: Deploy

# Deploys the Worker, the Durable Object namespace, the static assets and the cron.
#
# Nobody has to hand a Cloudflare token to anyone: it lives in repository secrets and is
# only ever read here. The deploy is deliberately not automatic on every branch: it runs on
# main, on a manual dispatch, or on a commit whose message contains [deploy], which is how
# the very first deploy is bootstrapped before this workflow reaches the default branch.
on:
  # Every branch, because the job's own condition decides whether to deploy. Restricting the
  # trigger to main would mean the [deploy] escape hatch could never fire, which is exactly
  # what happened the first time.
  push:
  workflow_dispatch:
    inputs:
      migrate:
        description: 'Apply D1 migrations before deploying'
        type: boolean
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Never deploy something that does not pass its own checks.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # The analytics beacon is baked into index.html at build time, so it has to be here
      # rather than in the deploy step. A repository *variable* rather than a secret: the
      # token is served to every visitor inside the HTML, so it is public by construction and
      # masking it in the logs would only make a missing one harder to notice. Unset means no
      # beacon and no script at all, which is what previews and forks should get.
      - run: pnpm build
        env:
          VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}

      - run: pnpm check:css
      - run: pnpm check:size

      - name: Ensure the D1 database exists
        id: d1
        run: node scripts/ensure-d1.mjs --write

      - name: Apply D1 migrations
        if: github.event_name != 'workflow_dispatch' || inputs.migrate
        run: pnpm --filter @teslawave/worker exec wrangler d1 migrations apply teslawave --remote

      - name: Deploy
        id: publish
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @teslawave/worker exec wrangler deploy | tee deploy.log
          # Only a fallback for SMOKE_URL, so a deploy that published fine must not fail here
          # for want of it. `shell: bash` runs with -e, and a grep that matches nothing exits
          # 1: without the guard, no workers.dev line in the log fails the step *after* the
          # worker is already live, which is exactly how this read as a failed deploy of a
          # deployment that had succeeded.
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Smoke test the deployment
        env:
          # A custom domain wins once it is configured; otherwise whatever wrangler printed.
          SMOKE_URL: ${{ vars.DEPLOY_URL || steps.publish.outputs.url }}
        run: node scripts/smoke.mjs

      - name: Summary
        run: |
          {
            echo "### TeslaWave deployed"
            echo
            echo "- URL: ${{ vars.DEPLOY_URL || steps.publish.outputs.url }}"
            echo "- D1 database: \`${{ steps.d1.outputs.database_id }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo
            echo "If this was the first deploy, commit the database id printed above into"
            echo "\`apps/worker/wrangler.jsonc\` so local \`wrangler\` targets the same database."
          } >> "$GITHUB_STEP_SUMMARY"
