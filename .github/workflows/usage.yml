name: Free-tier usage

# The cost guardrail. A hub that cannot hibernate is billed around the clock, so this looks
# at yesterday's real numbers every morning and shouts before a bill or an outage arrives.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# Declaring any permission drops every other scope to none, so both scopes this job uses are
# spelled out: `contents: read` for the checkout, `issues: write` for the report below.
permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: usage
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: node scripts/usage-report.mjs

      # The step above is allowed to fail, because going over the threshold is a failure that
      # still has to reach the issue below. That leaves one bad state: no report at all (no
      # credentials, or the analytics API said no). Say so, or a guardrail measuring nothing
      # looks exactly like a guardrail with nothing to report.
      - name: Warn when no report was produced
        if: steps.usage.outcome == 'failure' && steps.usage.outputs.report == ''
        run: |
          echo "::warning title=No usage report::scripts/usage-report.mjs produced no report." \
            "Check that CLOUDFLARE_ACCOUNT_ID (variable) or CF_ACCOUNT_ID (secret) and" \
            "CF_ANALYTICS_TOKEN (secret, Account Analytics: Read) are set, then read the step log."

      - name: Open or update the usage issue
        if: steps.usage.outputs.over_threshold == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const report = process.env.REPORT ?? 'see the workflow log';
            const title = 'Free-tier usage above 60%';
            const body = [
              'TeslaWave is using more than 60% of a Cloudflare free-tier daily limit.',
              '',
              '```',
              report,
              '```',
              '',
              'Requests are normally the binding constraint. If it is *duration* that is high,',
              'a Durable Object has stopped being eligible for hibernation: look for a timer,',
              'a `ws.accept()`, an alarm or an in-flight `fetch` in `apps/worker/src`, and read',
              'docs/decisions/0002-hub-durable-object-and-cost-model.md.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'usage',
            });
            const found = existing.data.find((issue) => issue.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['usage'],
              });
            }
        env:
          REPORT: ${{ steps.usage.outputs.report }}
