name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Lint first: the worker rules are cost invariants, not style (ADR-0002).
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Rendering budget (no blur, no animated shadows, no hardcoded screen size)
        run: pnpm check:css
      - name: Bundle budget (400 kB gzipped excluding MapLibre)
        run: pnpm check:size

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @teslawave/web exec playwright install --with-deps chromium

      - name: Acceptance criteria (car screen at both densities, and a phone)
        run: pnpm --filter @teslawave/web exec playwright test --project=tesla --project=tesla-dpr2 --project=phone

      # Advisory: a CI container has no GPU, so the composite frame rate is not comparable
      # to a car. The gate inside the spec is on our own per-frame work.
      - name: Frame budget
        continue-on-error: true
        run: pnpm --filter @teslawave/web exec playwright test --project=perf

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
