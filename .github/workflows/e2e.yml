name: E2E

# The browser suite is slow and needs a Chromium download, so it is not part of CI on every
# push and pull request. Run it from the Actions tab (or `gh workflow run e2e.yml`) when the
# rendering path changed and the acceptance criteria are worth re-checking.
on:
  workflow_dispatch:
    inputs:
      projects:
        description: 'Playwright projects to run (space separated)'
        type: string
        default: 'tesla tesla-dpr2 phone'
      perf:
        description: 'Also run the advisory frame-budget project'
        type: boolean
        default: true

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @teslawave/web exec playwright install --with-deps chromium

      - name: Acceptance criteria (car screen at both densities, and a phone)
        env:
          PROJECTS: ${{ inputs.projects }}
        run: |
          args=()
          for p in $PROJECTS; do args+=("--project=$p"); done
          pnpm --filter @teslawave/web exec playwright test "${args[@]}"

      # Advisory: a CI container has no GPU, so the composite frame rate is not comparable
      # to a car. The gate inside the spec is on our own per-frame work.
      - name: Frame budget
        if: inputs.perf
        continue-on-error: true
        run: pnpm --filter @teslawave/web exec playwright test --project=perf

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
