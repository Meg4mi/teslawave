name: E2E

# The browser suite is slow and needs a Chromium download, so it is not part of CI on every
# push. It runs every night, on any pull request that touches the rendering path, and from
# the Actions tab (or `gh workflow run e2e.yml`) whenever the acceptance criteria are worth
# re-checking. A manual-only suite is a suite nobody runs.
on:
  schedule:
    # 03:17 UTC, off the hour so it does not queue behind everyone else's nightly.
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - 'apps/web/src/map/**'
      - 'apps/web/src/overlay/**'
      - 'apps/web/src/screens/**'
      - 'apps/web/src/ui/**'
      - 'apps/web/src/app/**'
      - 'apps/web/src/**/*.css'
      - 'apps/web/e2e/**'
      - 'apps/web/playwright.config.ts'
      - 'apps/worker/scripts/dev-supervised.mjs'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      projects:
        description: 'Playwright projects to run (space separated)'
        type: string
        default: 'tesla tesla-dpr2 phone'
      perf:
        description: 'Also run the advisory frame-budget project'
        type: boolean
        default: true

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @teslawave/web exec playwright install --with-deps chromium

      - name: Acceptance criteria (car screen at both densities, and a phone)
        env:
          # Empty outside a manual run: the schedule and pull requests get the full set.
          PROJECTS: ${{ inputs.projects || 'tesla tesla-dpr2 phone' }}
        run: |
          args=()
          for p in $PROJECTS; do args+=("--project=$p"); done
          pnpm --filter @teslawave/web exec playwright test "${args[@]}"

      # Advisory: a CI container has no GPU, so the composite frame rate is not comparable
      # to a car. The gate inside the spec is on our own per-frame work.
      - name: Frame budget
        if: github.event_name != 'workflow_dispatch' || inputs.perf
        continue-on-error: true
        run: pnpm --filter @teslawave/web exec playwright test --project=perf

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
